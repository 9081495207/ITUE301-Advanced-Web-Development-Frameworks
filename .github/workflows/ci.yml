# ─────────────────────────────────────────────────────────────────────────────
# Practical 12: CI/CD Pipeline with GitHub Actions
# Workflow: CI Pipeline
#
# Triggers on every push to the `main` branch.
# Tests the self-contained Practical12/backend project.
# ─────────────────────────────────────────────────────────────────────────────

name: CI Pipeline - Practical 12

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Install dependencies and run automated tests ────────────────────
  build-and-test:
    name: Build & Test (Node.js 18)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: Practicals/Practical12/backend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: Practicals/Practical12/backend

      - name: Run tests
        run: npm test
        working-directory: Practicals/Practical12/backend
        env:
          NODE_ENV: test

  # ── Job 2: Lint (supplementary — runs in parallel with tests) ──────────────
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: Practicals/Practical12/backend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: Practicals/Practical12/backend

      - name: Run ESLint
        run: npm run lint
        working-directory: Practicals/Practical12/backend
